<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduLocker – Digital Document Management</title>

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com">
    </script>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js">
    </script>

    <!-- Custom Styles (unchanged) -->
    <style>
        * { font-family: 'Inter', sans-serif; box-sizing: border-box; }
        body { background: #f0f4f9; min-height: 100vh; }
        .glass { background: rgba(255,255,255,0.70); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.30); }
        .glass-card { background: rgba(255,255,255,0.85); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.40); box-shadow: 0 8px 32px rgba(0,20,50,0.08); transition: transform 0.25s ease, box-shadow 0.25s ease; }
        .glass-card:hover { transform: translateY(-4px); box-shadow: 0 16px 48px rgba(0,20,50,0.12); }
        .btn-primary { background: linear-gradient(135deg, #1a56db, #1e40af); color: white; padding: 0.60rem 1.50rem; border-radius: 40px; font-weight: 600; font-size: 0.95rem; border: none; cursor: pointer; transition: all 0.20s ease; box-shadow: 0 4px 14px rgba(26,86,219,0.30); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(26,86,219,0.40); }
        .btn-primary:disabled { opacity: 0.60; cursor: not-allowed; transform: none; }
        .btn-secondary { background: #e5e7eb; color: #1f2937; padding: 0.60rem 1.50rem; border-radius: 40px; font-weight: 600; font-size: 0.95rem; border: none; cursor: pointer; transition: all 0.20s ease; }
        .btn-secondary:hover { background: #d1d5db; }
        .btn-danger { background: linear-gradient(135deg, #dc2626, #b91c1c); color: white; padding: 0.60rem 1.50rem; border-radius: 40px; font-weight: 600; font-size: 0.95rem; border: none; cursor: pointer; transition: all 0.20s ease; box-shadow: 0 4px 14px rgba(220,38,38,0.30); }
        .btn-danger:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(220,38,38,0.40); }
        .input-field { width: 100%; padding: 0.70rem 1rem; border: 2px solid #e5e7eb; border-radius: 12px; font-size: 0.95rem; transition: border 0.20s ease, box-shadow 0.20s ease; background: white; }
        .input-field:focus { outline: none; border-color: #1a56db; box-shadow: 0 0 0 4px rgba(26,86,219,0.15); }
        .input-field.error { border-color: #dc2626; box-shadow: 0 0 0 4px rgba(220,38,38,0.12); }
        .badge { display: inline-block; padding: 0.20rem 0.75rem; border-radius: 40px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
        .badge-blue { background: #dbeafe; color: #1e40af; }
        .badge-green { background: #d1fae5; color: #065f46; }
        .badge-red { background: #fee2e2; color: #991b1b; }
        .badge-yellow { background: #fef3c7; color: #92400e; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c7cd; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #a0a8b0; }
        .dropzone { border: 2px dashed #cbd5e1; border-radius: 16px; padding: 2.5rem 1rem; text-align: center; transition: all 0.25s ease; cursor: pointer; background: rgba(255,255,255,0.50); }
        .dropzone:hover, .dropzone.dragover { border-color: #1a56db; background: rgba(26,86,219,0.05); }
        .dropzone .icon { font-size: 2.5rem; color: #94a3b8; margin-bottom: 0.50rem; }
        .dropzone p { color: #64748b; font-size: 0.95rem; }
        .toast { position: fixed; bottom: 2rem; right: 2rem; padding: 1rem 1.75rem; border-radius: 14px; color: white; font-weight: 500; font-size: 0.95rem; box-shadow: 0 12px 40px rgba(0,0,0,0.18); transform: translateY(120%); opacity: 0; transition: all 0.40s cubic-bezier(0.34,1.56,0.64,1); z-index: 9999; max-width: 420px; }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast-success { background: linear-gradient(135deg, #059669, #047857); }
        .toast-error { background: linear-gradient(135deg, #dc2626, #b91c1c); }
        .toast-info { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
        .sidebar { width: 260px; height: 100vh; position: fixed; top: 0; left: 0; background: rgba(255,255,255,0.92); backdrop-filter: blur(16px); border-right: 1px solid rgba(0,0,0,0.05); padding: 1.5rem 1rem; overflow-y: auto; z-index: 100; transition: transform 0.30s ease; }
        .sidebar .logo { font-size: 1.50rem; font-weight: 700; color: #0a1e3c; display: flex; align-items: center; gap: 0.60rem; padding-bottom: 1.50rem; border-bottom: 1px solid rgba(0,0,0,0.06); margin-bottom: 1.50rem; cursor: pointer; }
        .sidebar .logo i { color: #1a56db; font-size: 1.80rem; }
        .sidebar .nav-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.70rem 1rem; border-radius: 12px; color: #374151; font-weight: 500; transition: all 0.15s ease; cursor: pointer; text-decoration: none; margin-bottom: 0.25rem; }
        .sidebar .nav-item:hover { background: rgba(26,86,219,0.08); color: #1a56db; }
        .sidebar .nav-item.active { background: rgba(26,86,219,0.12); color: #1a56db; font-weight: 600; }
        .sidebar .nav-item i { width: 1.25rem; text-align: center; font-size: 1.05rem; }
        .sidebar .user-badge { padding: 1rem; border-radius: 12px; background: rgba(26,86,219,0.06); margin-top: 1.50rem; border: 1px solid rgba(26,86,219,0.08); }
        .sidebar .user-badge .name { font-weight: 600; color: #0a1e3c; }
        .sidebar .user-badge .role { font-size: 0.80rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.04em; }
        .main-content { margin-left: 260px; padding: 2rem 2rem 3rem; min-height: 100vh; }
        @media (max-width: 768px) { .sidebar { transform: translateX(-100%); width: 280px; } .sidebar.open { transform: translateX(0); } .main-content { margin-left: 0; padding: 1.25rem; } .mobile-hamburger { display: flex !important; } }
        .mobile-hamburger { display: none; }
        .doc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1.25rem; }
        .doc-card { background: white; border-radius: 16px; padding: 1.25rem 1rem; box-shadow: 0 2px 12px rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.04); transition: all 0.20s ease; text-align: center; }
        .doc-card:hover { transform: translateY(-4px); box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
        .doc-card .doc-icon { font-size: 2.5rem; color: #1a56db; margin-bottom: 0.50rem; }
        .doc-card .doc-name { font-weight: 600; font-size: 0.95rem; color: #0a1e3c; margin-bottom: 0.20rem; word-break: break-word; }
        .doc-card .doc-meta { font-size: 0.75rem; color: #94a3b8; }
        .doc-card .doc-actions { margin-top: 0.75rem; display: flex; gap: 0.50rem; justify-content: center; flex-wrap: wrap; }
        .doc-card .doc-actions button { background: none; border: none; cursor: pointer; padding: 0.30rem 0.60rem; border-radius: 8px; font-size: 0.85rem; transition: all 0.15s ease; display: flex; align-items: center; gap: 0.30rem; }
        .doc-card .doc-actions .btn-download { color: #1a56db; background: rgba(26,86,219,0.08); }
        .doc-card .doc-actions .btn-download:hover { background: rgba(26,86,219,0.16); }
        .doc-card .doc-actions .btn-delete { color: #dc2626; background: rgba(220,38,38,0.08); }
        .doc-card .doc-actions .btn-delete:hover { background: rgba(220,38,38,0.16); }
        .doc-card .doc-actions .btn-code { color: #065f46; background: rgba(5,95,70,0.08); }
        .doc-card .doc-actions .btn-code:hover { background: rgba(5,95,70,0.16); }
        .spinner { display: inline-block; width: 1.2rem; height: 1.2rem; border: 3px solid rgba(255,255,255,0.30); border-top: 3px solid white; border-radius: 50%; animation: spin 0.70s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .empty-state { text-align: center; padding: 3rem 1rem; color: #94a3b8; }
        .empty-state i { font-size: 3.5rem; margin-bottom: 1rem; opacity: 0.50; }
        .empty-state h3 { font-size: 1.25rem; font-weight: 600; color: #475569; }
        .empty-state p { font-size: 0.95rem; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.40); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; z-index: 999; opacity: 0; pointer-events: none; transition: opacity 0.30s ease; }
        .modal-overlay.open { opacity: 1; pointer-events: all; }
        .modal-box { background: white; border-radius: 24px; padding: 2rem 2.5rem; max-width: 520px; width: 92%; box-shadow: 0 24px 80px rgba(0,0,0,0.20); transform: scale(0.92) translateY(20px); transition: transform 0.30s ease; }
        .modal-overlay.open .modal-box { transform: scale(1) translateY(0); }
        .modal-box .modal-title { font-size: 1.30rem; font-weight: 700; color: #0a1e3c; margin-bottom: 0.50rem; }
        .modal-box .modal-sub { color: #64748b; font-size: 0.95rem; margin-bottom: 1.25rem; }
        .code-display { background: #f8fafc; border-radius: 12px; padding: 1rem; font-family: 'Courier New', monospace; font-size: 1.75rem; font-weight: 700; letter-spacing: 0.15em; color: #0a1e3c; text-align: center; border: 2px dashed #cbd5e1; }
        .teacher-doc-view { background: white; border-radius: 16px; padding: 1.50rem; border: 1px solid rgba(0,0,0,0.04); }
        .log-item { display: flex; align-items: center; gap: 1rem; padding: 0.60rem 0; border-bottom: 1px solid #f1f5f9; font-size: 0.90rem; }
        .log-item .log-time { color: #94a3b8; font-size: 0.75rem; min-width: 70px; }
        .log-item .log-action { flex: 1; color: #1f2937; }
        .stat-card { background: white; border-radius: 16px; padding: 1.25rem 1.50rem; border: 1px solid rgba(0,0,0,0.04); box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
        .stat-card .stat-number { font-size: 2rem; font-weight: 700; color: #0a1e3c; }
        .stat-card .stat-label { color: #64748b; font-size: 0.85rem; font-weight: 500; }
        .stat-card .stat-icon { font-size: 2rem; color: #1a56db; opacity: 0.30; }
    </style>
</head>

<body>

    <!-- ─── TOAST CONTAINER ─── -->
    <div id="toast" class="toast"></div>

    <!-- ─── MODAL ─── -->
    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-box">
            <div id="modalContent">
                <!-- Dynamically rendered -->
            </div>
        </div>
    </div>

    <!-- ─── SIDEBAR ─── -->
    <aside id="sidebar" class="sidebar">
        <div class="logo" id="logoToggle">
            <i class="fas fa-lock"></i>
            <span>EduLocker</span>
        </div>

        <nav id="sidebarNav">
            <!-- Dynamic nav items injected by JS -->
        </nav>

        <div class="user-badge" id="userBadge">
            <div class="name" id="sidebarUserName">User</div>
            <div class="role" id="sidebarUserRole">Student</div>
            <button onclick="handleLogout()" class="btn-secondary w-full mt-3 text-sm" style="border-radius:40px;padding:0.50rem;">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </aside>

    <!-- ─── MOBILE HAMBURGER ─── -->
    <button class="mobile-hamburger fixed top-4 left-4 z-50 bg-white p-2 rounded-xl shadow-md border border-gray-100 text-xl" onclick="toggleSidebar()">
        <i class="fas fa-bars"></i>
    </button>

    <!-- ─── MAIN CONTENT ─── -->
    <main class="main-content" id="mainContent">
        <div id="pageContent">
            <!-- Dynamic content -->
        </div>
    </main>

    <script>
        // ═══════════════════════════════════════════════════════════
        //  🔥 FIREBASE CONFIGURATION – REPLACE WITH YOUR OWN VALUES
        // ═══════════════════════════════════════════════════════════

        const firebaseConfig = {
            apiKey: "AIzaSyCikTHcl-tDNcLpZEKwtQ7XiRwZ36So6G0",
            authDomain: "edulocker-57638.firebaseapp.com",
            projectId: "edulocker-57638",
            storageBucket: "edulocker-57638.firebasestorage.app",
            messagingSenderId: "328752977138",
            appId: "1:328752977138:web:df4ee43ab75fb3f38a2c6b"
        };

        // ─── Initialize Firebase ───
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const storage = firebase.storage();
        db.enablePersistence({ synchronizeTabs: true }).catch(() => {});

        // ─── Globals ───
        let currentUser = null;
        let currentRole = null;

        // ─── Utility ───
        function showToast(message, type = 'success') {
            const t = document.getElementById('toast');
            t.textContent = message;
            t.className = 'toast toast-' + type + ' show';
            clearTimeout(t._hide);
            t._hide = setTimeout(() => t.classList.remove('show'), 3800);
        }

        function openModal(html) {
            document.getElementById('modalContent').innerHTML = html;
            document.getElementById('modalOverlay').classList.add('open');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('open');
        }
        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        document.addEventListener('DOMContentLoaded', function() {
            const logo = document.getElementById('logoToggle');
            if (logo) logo.addEventListener('click', toggleSidebar);
        });

        function generateSecurityCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 8; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
            return code;
        }

        function formatDate(ts) {
            if (!ts) return '—';
            const d = ts.toDate ? ts.toDate() : new Date(ts);
            return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
        }

        function formatTime(ts) {
            if (!ts) return '—';
            const d = ts.toDate ? ts.toDate() : new Date(ts);
            return d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
        }

        function getFileIcon(mimeType) {
            if (!mimeType) return 'fa-file';
            if (mimeType.includes('pdf')) return 'fa-file-pdf';
            if (mimeType.includes('image')) return 'fa-file-image';
            if (mimeType.includes('word') || mimeType.includes('doc')) return 'fa-file-word';
            return 'fa-file';
        }

        function getFileColor(mimeType) {
            if (!mimeType) return '#64748b';
            if (mimeType.includes('pdf')) return '#dc2626';
            if (mimeType.includes('image')) return '#2563eb';
            if (mimeType.includes('word') || mimeType.includes('doc')) return '#1e40af';
            return '#64748b';
        }

        // ─── Auth ───
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                try {
                    const doc = await db.collection('users').doc(user.uid).get();
                    if (doc.exists) {
                        const data = doc.data();
                        currentUser = { uid: user.uid, email: user.email, ...data };
                        currentRole = data.role || 'student';
                    } else {
                        currentUser = { uid: user.uid, email: user.email, role: 'student', name: user.displayName ||
                                'User' };
                        currentRole = 'student';
                    }
                    renderApp();
                } catch (err) {
                    console.error('Profile fetch error:', err);
                    currentUser = { uid: user.uid, email: user.email, role: 'student', name: user.displayName || 'User' };
                    currentRole = 'student';
                    renderApp();
                }
            } else {
                currentUser = null;
                currentRole = null;
                renderApp();
            }
        });

        // ─── Render Engine ───
        function renderApp() {
            if (!currentUser) {
                renderLoginPage();
                renderSidebar(null);
                return;
            }
            renderSidebar(currentUser);
            const hash = window.location.hash.replace('#', '') || 'dashboard';
            const role = currentRole;
            if (role === 'student') renderStudentPage(hash);
            else if (role === 'teacher') renderTeacherPage(hash);
            else if (role === 'admin') renderAdminPage(hash);
            else renderLoginPage();
        }

        function renderSidebar(user) {
            const nav = document.getElementById('sidebarNav');
            const badge = document.getElementById('userBadge');
            if (!user) { nav.innerHTML = '';
                badge.style.display = 'none'; return; }
            badge.style.display = 'block';
            document.getElementById('sidebarUserName').textContent = user.name || user.email || 'User';
            document.getElementById('sidebarUserRole').textContent = (user.role || 'student').toUpperCase();

            const role = user.role || 'student';
            let items = [];
            if (role === 'student') {
                items = [
                    { label: 'Dashboard', icon: 'fa-th-large', href: '#dashboard' },
                    { label: 'My Documents', icon: 'fa-folder-open', href: '#documents' },
                    { label: 'Upload', icon: 'fa-cloud-upload-alt', href: '#upload' },
                    { label: 'Profile', icon: 'fa-user-circle', href: '#profile' },
                ];
            } else if (role === 'teacher') {
                items = [
                    { label: 'Dashboard', icon: 'fa-th-large', href: '#dashboard' },
                    { label: 'Access Student', icon: 'fa-search', href: '#access' },
                    { label: 'Access Logs', icon: 'fa-history', href: '#logs' },
                ];
            } else if (role === 'admin') {
                items = [
                    { label: 'Dashboard', icon: 'fa-th-large', href: '#dashboard' },
                    { label: 'Teachers', icon: 'fa-chalkboard-teacher', href: '#teachers' },
                    { label: 'Students', icon: 'fa-user-graduate', href: '#students' },
                    { label: 'Reports', icon: 'fa-chart-bar', href: '#reports' },
                ];
            }
            nav.innerHTML = items.map(item =>
                `<a class="nav-item ${window.location.hash === item.href ? 'active' : ''}" href="${item.href}">
              <i class="fas ${item.icon}"></i> ${item.label}
            </a>`
            ).join('');
            nav.querySelectorAll('.nav-item').forEach(el => {
                el.addEventListener('click', (e) => {
                    e.preventDefault();
                    window.location.hash = el.getAttribute('href').replace('#', '');
                    renderApp();
                    if (window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('open');
                });
            });
        }

        // ─── Login / Register ───
        function renderLoginPage() {
            const container = document.getElementById('pageContent');
            container.innerHTML = `
            <div class="max-w-md mx-auto mt-10 md:mt-20">
              <div class="glass-card rounded-3xl p-8 md:p-10">
                <div class="text-center mb-8">
                  <div class="text-4xl text-blue-600 mb-2"><i class="fas fa-lock"></i></div>
                  <h1 class="text-2xl font-bold text-gray-900">Welcome to EduLocker</h1>
                  <p class="text-gray-500 text-sm">Secure Digital Document Management</p>
                </div>
                <div class="flex bg-gray-100 rounded-xl p-1 mb-6">
                  <button id="loginTab" class="flex-1 py-2 rounded-lg font-medium text-sm transition bg-white shadow-sm">Login</button>
                  <button id="registerTab" class="flex-1 py-2 rounded-lg font-medium text-sm transition text-gray-500">Register</button>
                </div>
                <div id="loginForm">
                  <div class="space-y-4">
                    <div><label class="block text-sm font-medium text-gray-700 mb-1">Email</label><input id="loginEmail" type="email" class="input-field" placeholder="you@institution.edu" /></div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1">Password</label><input id="loginPassword" type="password" class="input-field" placeholder="••••••••" /></div>
                    <button id="loginBtn" class="btn-primary w-full">Sign In</button>
                    <p class="text-center text-sm text-gray-500 mt-3">Demo: student@demo.com / password123</p>
                  </div>
                </div>
                <div id="registerForm" style="display:none;">
                  <div class="space-y-4">
                    <div><label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label><input id="regName" type="text" class="input-field" placeholder="Your full name" /></div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1">Email</label><input id="regEmail" type="email" class="input-field" placeholder="you@institution.edu" /></div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1">Roll Number</label><input id="regRoll" type="text" class="input-field" placeholder="e.g. CS2024001" /></div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1">Department</label>
                      <select id="regDept" class="input-field">
                        <option value="">Select Department</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Information Technology">Information Technology</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Mechanical">Mechanical</option>
                        <option value="Civil">Civil</option>
                        <option value="AI & ML">AI & ML</option>
                        <option value="Other">Other</option>
                      </select>
                    </div>
                    <div><label class="block text-sm font-medium text-gray-700 mb-1">Password</label><input id="regPassword" type="password" class="input-field" placeholder="Min 8 chars" /></div>
                    <button id="registerBtn" class="btn-primary w-full">Create Account</button>
                  </div>
                </div>
              </div>
            </div>
          `;
            document.getElementById('loginTab').addEventListener('click', function() {
                document.getElementById('loginForm').style.display = 'block';
                document.getElementById('registerForm').style.display = 'none';
                this.className = 'flex-1 py-2 rounded-lg font-medium text-sm transition bg-white shadow-sm';
                document.getElementById('registerTab').className =
                    'flex-1 py-2 rounded-lg font-medium text-sm transition text-gray-500';
            });
            document.getElementById('registerTab').addEventListener('click', function() {
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('registerForm').style.display = 'block';
                this.className = 'flex-1 py-2 rounded-lg font-medium text-sm transition bg-white shadow-sm';
                document.getElementById('loginTab').className =
                    'flex-1 py-2 rounded-lg font-medium text-sm transition text-gray-500';
            });
            document.getElementById('loginBtn').addEventListener('click', handleLogin);
            document.getElementById('loginPassword').addEventListener('keydown', (e) => { if (e.key === 'Enter')
                    handleLogin(); });

        async function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            if (!email || !password) return showToast('Please fill in all fields.', 'error');
            try {
                await auth.signInWithEmailAndPassword(email, password);
                showToast('Welcome back!', 'success');
            } catch (err) { showToast(err.message, 'error'); }
        }

        async function handleRegister() {
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const roll = document.getElementById('regRoll').value.trim();
            const dept = document.getElementById('regDept').value;
            const password = document.getElementById('regPassword').value;
            if (!name || !email || !roll || !dept || !password) return showToast('Please fill in all fields.', 'error');
            if (password.length < 8) return showToast('Password must be at least 8 characters.', 'error');
            try {
                const cred = await auth.createUserWithEmailAndPassword(email, password);
                const user = cred.user;
                await db.collection('users').doc(user.uid).set({
                    name,
                    email,
                    rollNumber: roll,
                    department: dept,
                    role: 'student',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    profileImage: '',
                });
                showToast('Account created successfully!', 'success');
            } catch (err) { showToast(err.message, 'error'); }
        }

            try { await auth.signOut();

                snap.forEach(d => allDocs.push({ id: d.id, ...d.data() }));

                // Sort client‑side by uploadedAt (most recent first)
                allDocs.sort((a, b) => {
                    const tA = a.uploadedAt ? (a.uploadedAt.toDate ? a.uploadedAt.toDate() : new Date(a.uploadedAt)) :
                        0;
                    const tB = b.uploadedAt ? (b.uploadedAt.toDate ? b.uploadedAt.toDate() : new Date(b.uploadedAt)) :
                        0;
                    return tB - tA;
                });

                document.getElementById('searchBtn').addEventListener('click', () => filterDocs(allDocs));

        function filterDocs(allDocs) {
            const search = document.getElementById('docSearch').value.toLowerCase().trim();
            const category = document.getElementById('docFilter').value;
            let filtered = allDocs;
            if (search) filtered = filtered.filter(d =>
                (d.name || '').toLowerCase().includes(search) ||
                (d.category || '').toLowerCase().includes(search)
            );
            if (category) filtered = filtered.filter(d => d.category === category);
            renderDocList(filtered);
        }

        function renderDocList(docs) {
            const container = document.getElementById('docList');

                container.innerHTML =
                    `<div class="empty-state col-span-full"><i class="fas fa-folder-open"></i><h3>No documents found</h3><p>Try adjusting your search.</p></div>`;
                return;
            }
            container.innerHTML = docs.map(d => renderDocCard(d)).join('');
        }

        function renderStudentUpload(container) {

            <div class="max-w-2xl mx-auto">

                      <option value="Passport">Passport</option>
                      <option value="Other">Other</option>
                    </select>
                  </div>

                </form>
              </div>

          `;

            const dropzone = document.getElementById('dropzone');
            const fileInput = document.getElementById('fileInput');
            let selectedFile = null;
            dropzone.addEventListener('click', () => fileInput.click());
            dropzone.addEventListener('dragover', (e) => { e.preventDefault();
                dropzone.classList.add('dragover'); });
            dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
            dropzone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropzone.classList.remove('dragover');
                if (e.dataTransfer.files.length) { selectedFile = e.dataTransfer.files[0];
                    updateFileInfo(selectedFile); }
            });
            fileInput.addEventListener('change', () => {
                if (fileInput.files.length) { selectedFile = fileInput.files[0];
                    updateFileInfo(selectedFile); }
            });

            function updateFileInfo(file) {
                const info = document.getElementById('fileInfo');
                info.classList.remove('hidden');
                document.getElementById('fileName').textContent = file.name;
                document.getElementById('fileSize').textContent = (file.size / 1024).toFixed(1) + ' KB';
                if (file.size > 20 * 1024 * 1024) {
                    showToast('File size exceeds 20 MB limit.', 'error');
                    selectedFile = null;
                    info.classList.add('hidden');
                }
            }

            document.getElementById('uploadForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = document.getElementById('docName').value.trim();
                const category = document.getElementById('docCategory').value;
                const desc = document.getElementById('docDesc').value.trim();
                if (!name || !category || !selectedFile) return showToast('Please fill in all required fields and select a file.',
                    'error');
                if (selectedFile.size > 20 * 1024 * 1024) return showToast('File size exceeds 20 MB limit.',
                'error');
                const btn = document.getElementById('uploadBtn');
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner"></span> Uploading...';
                try {
                    const uid = currentUser.uid;
                    const code = generateSecurityCode();
                    const path = `documents/${uid}/${Date.now()}_${selectedFile.name}`;
                    const ref = storage.ref(path);
                    await ref.put(selectedFile);
                    const url = await ref.getDownloadURL();
                    await db.collection('documents').add({
                        studentId: uid,
                        name,
                        category,
                        description: desc,
                        fileUrl: url,
                        fileType: selectedFile.type || 'application/octet-stream',
                        fileSize: selectedFile.size,
                        fileName: selectedFile.name,
                        securityCode: code,
                        uploadedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    });
                    await db.collection('activities').add({
                        userId: uid,
                        userRole: 'student',
                        action: `Uploaded document: ${name}`,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    });
                    showToast('Document uploaded successfully! Security Code: ' + code, 'success');
                    document.getElementById('uploadForm').reset();
                    document.getElementById('fileInfo').classList.add('hidden');
                    selectedFile = null;
                    fileInput.value = '';
                    setTimeout(() => { window.location.hash = 'documents';
                        renderApp(); }, 1200);
                } catch (err) {
                    console.error('Upload error:', err);
                    let msg = 'Upload failed: ';
                    if (err.code === 'storage/unauthorized') msg += 'Permission denied. Check Storage rules.';
                    else if (err.code === 'storage/canceled') msg += 'Upload canceled.';
                    else msg += err.message;
                    showToast(msg, 'error');
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> Upload Document';
                }
            });
        }

        // ─── Document Actions ───
        async function downloadDoc(docId, url, name) {
            if (!url) return showToast('Document URL not available.', 'error');
            try {
                window.open(url, '_blank');
                await db.collection('activities').add({
                    userId: currentUser.uid,
                    userRole: currentUser.role,
                    action: `Downloaded document: ${name || docId}`,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                });
            } catch (err) { showToast('Error downloading.', 'error'); }

        async function deleteDoc(docId) {
            if (!confirm('Delete this document permanently?')) return;
            try {
                const doc = await db.collection('documents').doc(docId).get();
                if (!doc.exists) return showToast('Document not found.', 'error');
                const data = doc.data();
                if (data.fileUrl) {
                    try { await storage.refFromURL(data.fileUrl).delete(); } catch (e) { console.warn('Storage delete failed:',
                            e); }
                }
                await db.collection('documents').doc(docId).delete();
                showToast('Document deleted.', 'info');
                renderApp();
            } catch (err) { showToast('Delete failed: ' + err.message, 'error'); }
        }

        async function teacherAccessByCode() {
            const code = document.getElementById('accessCode')?.value?.trim() ||
                document.getElementById('quickCode')?.value?.trim();
            if (!code) return showToast('Please enter a security code.', 'error');
            const resultContainer = document.getElementById('accessResult') ||
                document.getElementById('quickResult');
            if (!resultContainer) return;
            resultContainer.innerHTML = `<div class="text-center py-4"><span class="spinner"></span> Loading...</div>`;
            try {
                const snap = await db.collection('documents').where('securityCode', '==', code).limit(1).get();
                if (snap.empty) {
                    resultContainer.innerHTML =
                        `<div class="text-center py-6 text-red-600"><i class="fas fa-times-circle text-2xl"></i><p class="mt-2">No document found with this security code.</p></div>`;
                    return;
                }
                const doc = snap.docs[0];
                const data = doc.data();
                const studentSnap = await db.collection('users').doc(data.studentId).get();
                const student = studentSnap.exists ? studentSnap.data() : { name: 'Unknown Student', email: '—' };
                await db.collection('activities').add({
                    userId: currentUser.uid,
                    userRole: 'teacher',
                    action: `Accessed document: ${data.name} (Student: ${student.name})`,
                    metadata: { studentId: data.studentId, documentId: doc.id, securityCode: code },
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                });

              <div class="teacher-doc-view">
                <div class="flex items-center justify-between mb-3">
                  <div>
                    <h3 class="font-semibold text-lg">${data.name || 'Untitled'}</h3>
                    <p class="text-sm text-gray-500">Student: ${student.name} • ${student.rollNumber || '—'} • ${student.department || '—'}</p>
                    <p class="text-sm text-gray-500">Category: ${data.category || 'Other'} • Uploaded: ${formatDate(data.uploadedAt)}</p>
                  </div>
                  <button onclick="window.open('${data.fileUrl}','_blank')" class="btn-primary"><i class="fas fa-download"></i> Download</button>
                </div>
                ${data.description ? `<p class="text-gray-600 text-sm">${data.description}</p>` : ''}
                <div class="mt-3 text-xs text-gray-400">Security Code: <span class="font-mono font-bold">${code}</span></div>
              </div>
            `;
                showToast('Document accessed successfully!', 'success');
            } catch (err) {
                console.error(err);
                resultContainer.innerHTML =
                    `<div class="text-center py-6 text-red-600"><p>Error: ${err.message}</p></div>`;
            }
        }

        // ─── Teacher Logs ───
        async function renderTeacherLogs(container) {
            container.innerHTML = `
            <div class="mb-6"><h1 class="text-2xl font-bold text-gray-900">Access Logs</h1><p class="text-gray-500">History of documents you've accessed.</p></div>
            <div class="glass-card rounded-2xl p-6"><div id="teacherLogList"><div class="text-center py-8 text-gray-400"><i class="fas fa-spinner fa-spin"></i> Loading...</div></div></div>
          `;
            try {
                const uid = currentUser.uid;
                const snap = await db.collection('activities')
                    .where('userId', '==', uid)
                    .where('userRole', '==', 'teacher')
                    .orderBy('timestamp', 'desc')
                    .limit(50)
                    .get();
                const logs = [];
                snap.forEach(d => logs.push({ id: d.id, ...d.data() }));
                const container2 = document.getElementById('teacherLogList');
                if (logs.length === 0) {
                    container2.innerHTML =
                        `<div class="text-center py-8 text-gray-400"><i class="fas fa-history text-3xl"></i><p class="mt-2">No access logs yet.</p></div>`;
                } else {
                    container2.innerHTML = logs.map(log => `
                <div class="log-item"><span class="log-time">${formatTime(log.timestamp)}</span><span class="log-action">${log.action || '—'}</span><span class="text-xs text-gray-400">${formatDate(log.timestamp)}</span></div>
              `).join('');
                }
            } catch (err) {
                console.error(err);
                document.getElementById('teacherLogList').innerHTML =
                    `<div class="text-center py-8 text-red-500">Error loading logs: ${err.message}</div>`;
                showToast('Error loading logs: ' + err.message, 'error');
            }
        }

        // ─── Admin Pages ───
        function renderAdminPage(hash) {
            const container = document.getElementById('pageContent');
            if (hash === 'dashboard') renderAdminDashboard(container);
            else if (hash === 'teachers') renderAdminTeachers(container);
            else if (hash === 'students') renderAdminStudents(container);
            else if (hash === 'reports') renderAdminReports(container);
            else renderAdminDashboard(container);
        }

        async function renderAdminDashboard(container) {
            container.innerHTML = `
            <div class="mb-6"><h1 class="text-2xl font-bold text-gray-900">Admin Dashboard</h1><p class="text-gray-500">System overview and statistics.</p></div>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6" id="adminStats">
              <div class="stat-card"><div class="stat-number" id="statStudents">—</div><div class="stat-label">Students</div></div>
              <div class="stat-card"><div class="stat-number" id="statTeachers">—</div><div class="stat-label">Teachers</div></div>
              <div class="stat-card"><div class="stat-number" id="statDocs">—</div><div class="stat-label">Documents</div></div>
              <div class="stat-card"><div class="stat-number" id="statActivities">—</div><div class="stat-label">Activities</div></div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div class="glass-card rounded-2xl p-6"><h3 class="font-semibold text-gray-800 mb-3"><i class="fas fa-history"></i> Recent Activity</h3><div id="adminRecentLogs"><div class="text-center py-4 text-gray-400 text-sm">Loading...</div></div></div>
              <div class="glass-card rounded-2xl p-6"><h3 class="font-semibold text-gray-800 mb-3"><i class="fas fa-chart-pie"></i> Storage Overview</h3><div id="adminStorageInfo"><div class="text-center py-4 text-gray-400 text-sm">Calculating...</div></div></div>
            </div>
          `;

            try {
                const [students, teachers, docs, activities] = await Promise.all([
                    db.collection('users').where('role', '==', 'student').get(),
                    db.collection('users').where('role', '==', 'teacher').get(),
                    db.collection('documents').get(),
                    db.collection('activities').orderBy('timestamp', 'desc').limit(20).get(),
                ]);
                document.getElementById('statStudents').textContent = students.size;
                document.getElementById('statTeachers').textContent = teachers.size;
                document.getElementById('statDocs').textContent = docs.size;
                const allActs = await db.collection('activities').get();
                document.getElementById('statActivities').textContent = allActs.size;
                const logContainer = document.getElementById('adminRecentLogs');
                if (activities.empty) {
                    logContainer.innerHTML = `<div class="text-center py-4 text-gray-400 text-sm">No recent activity.</div>`;
                } else {
                    logContainer.innerHTML = activities.docs.map(d => {
                        const data = d.data();
                        return `<div class="log-item text-sm"><span class="log-time">${formatTime(data.timestamp)}</span><span class="log-action">${data.action || '—'}</span></div>`;
                    }).join('');
                }
                let totalSize = 0;
                docs.forEach(d => { totalSize += (d.data().fileSize || 0); });
                document.getElementById('adminStorageInfo').innerHTML = `
              <div class="space-y-2 text-sm">
                <div class="flex justify-between"><span>Total Documents</span><span class="font-medium">${docs.size}</span></div>
                <div class="flex justify-between"><span>Total Storage Used</span><span class="font-medium">${(totalSize / (1024*1024)).toFixed(2)} MB</span></div>
                <div class="flex justify-between"><span>Average File Size</span><span class="font-medium">${docs.size > 0 ? (totalSize / docs.size / 1024).toFixed(1) : 0} KB</span></div>
              </div>
            `;
            } catch (err) {
                console.error(err);
                showToast('Error loading admin stats: ' + err.message, 'error');
            }
        }

        // ─── Admin Teachers ───
        async function renderAdminTeachers(container) {
            container.innerHTML = `
            <div class="flex items-center justify-between mb-6">
              <div><h1 class="text-2xl font-bold text-gray-900">Manage Teachers</h1><p class="text-gray-500">Add, edit, or remove teacher accounts.</p></div>
              <button onclick="showAddTeacherModal()" class="btn-primary"><i class="fas fa-plus"></i> Add Teacher</button>
            </div>
            <div class="glass-card rounded-2xl p-6"><div id="teacherList"><div class="text-center py-8 text-gray-400"><i class="fas fa-spinner fa-spin"></i> Loading...</div></div></div>
          `;
            loadTeacherList();
        }

        async function loadTeacherList() {
            try {
                const snap = await db.collection('users').where('role', '==', 'teacher').get();
                const teachers = [];
                snap.forEach(d => teachers.push({ id: d.id, ...d.data() }));
                const container2 = document.getElementById('teacherList');
                if (teachers.length === 0) {
                    container2.innerHTML =
                        `<div class="text-center py-8 text-gray-400"><i class="fas fa-chalkboard-teacher text-3xl"></i><p class="mt-2">No teachers found.</p></div>`;
                } else {
                    container2.innerHTML = teachers.map(t => `
                <div class="flex items-center justify-between p-3 border-b border-gray-100">
                  <div><div class="font-medium">${t.name || '—'}</div><div class="text-sm text-gray-500">${t.email || '—'} • ${t.department || '—'}</div></div>
                  <div class="flex gap-2"><button onclick="deleteTeacher('${t.id}')" class="text-red-500 hover:text-red-700 text-sm"><i class="fas fa-trash"></i></button></div>
                </div>
              `).join('');
                }
            } catch (err) {
                console.error(err);
                document.getElementById('teacherList').innerHTML =
                    `<div class="text-center py-8 text-red-500">Error loading teachers: ${err.message}</div>`;
            }
        }

        function showAddTeacherModal() {
            openModal(`
            <div class="modal-title"><i class="fas fa-chalkboard-teacher text-blue-600"></i> Add Teacher</div>
            <div class="modal-sub">Create a new teacher account. They will receive a welcome email.</div>
            <form id="addTeacherForm" class="space-y-4">
              <div><label class="block text-sm font-medium text-gray-700 mb-1">Full Name *</label><input id="teacherName" type="text" class="input-field" placeholder="Dr. Rajesh Kumar" required /></div>
              <div><label class="block text-sm font-medium text-gray-700 mb-1">Email *</label><input id="teacherEmail" type="email" class="input-field" placeholder="teacher@institution.edu" required /></div>
              <div><label class="block text-sm font-medium text-gray-700 mb-1">Department *</label>
                <select id="teacherDept" class="input-field" required>
                  <option value="">Select Department</option>
                  <option value="Computer Science">Computer Science</option>
                  <option value="Information Technology">Information Technology</option>
                  <option value="Electronics">Electronics</option>
                  <option value="Mechanical">Mechanical</option>
                  <option value="Civil">Civil</option>
                  <option value="AI & ML">AI & ML</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div><label class="block text-sm font-medium text-gray-700 mb-1">Temporary Password *</label><input id="teacherPassword" type="password" class="input-field" placeholder="Min 8 characters" required /></div>
              <button type="submit" class="btn-primary w-full">Create Teacher Account</button>
            </form>
          `);
            document.getElementById('addTeacherForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = document.getElementById('teacherName').value.trim();
                const email = document.getElementById('teacherEmail').value.trim();
                const dept = document.getElementById('teacherDept').value;
                const password = document.getElementById('teacherPassword').value;
                if (!name || !email || !dept || !password) return showToast('All fields required.', 'error');
                if (password.length < 8) return showToast('Password must be at least 8 chars.', 'error');
                try {
                    const cred = await auth.createUserWithEmailAndPassword(email, password);
                    const user = cred.user;
                    await db.collection('users').doc(user.uid).set({
                        name,
                        email,
                        department: dept,
                        role: 'teacher',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    });
                    showToast('Teacher account created!', 'success');
                    closeModal();
                    renderApp();
                } catch (err) { showToast(err.message, 'error'); }
            });
        }

        async function deleteTeacher(uid) {
            if (!confirm('Delete this teacher account permanently?')) return;
            try {
                await db.collection('users').doc(uid).delete();
                showToast('Teacher removed.', 'info');
                renderApp();
            } catch (err) { showToast(err.message, 'error'); }
        }

        // ─── Admin Students ───
        async function renderAdminStudents(container) {
            container.innerHTML = `
            <div class="mb-6"><h1 class="text-2xl font-bold text-gray-900">Manage Students</h1><p class="text-gray-500">View and manage all student accounts.</p></div>
            <div class="glass-card rounded-2xl p-6">
              <div class="mb-3"><input id="studentSearchAdmin" type="text" class="input-field max-w-sm" placeholder="Search by name, email, roll..." /></div>
              <div id="studentListAdmin"><div class="text-center py-8 text-gray-400"><i class="fas fa-spinner fa-spin"></i> Loading...</div></div>
            </div>
          `;
            loadStudentListAdmin();
            document.getElementById('studentSearchAdmin').addEventListener('keyup', loadStudentListAdmin);
        }

        async function loadStudentListAdmin() {
            const search = document.getElementById('studentSearchAdmin')?.value?.toLowerCase().trim() || '';
            try {
                const snap = await db.collection('users').where('role', '==', 'student').get();
                let students = [];
                snap.forEach(d => students.push({ id: d.id, ...d.data() }));
                if (search) {
                    students = students.filter(s =>
                        (s.name || '').toLowerCase().includes(search) ||
                        (s.email || '').toLowerCase().includes(search) ||
                        (s.rollNumber || '').toLowerCase().includes(search)
                    );
                }
                const container2 = document.getElementById('studentListAdmin');
                if (students.length === 0) {
                    container2.innerHTML =
                        `<div class="text-center py-8 text-gray-400"><i class="fas fa-user-graduate text-3xl"></i><p class="mt-2">No students found.</p></div>`;
                } else {
                    container2.innerHTML = students.map(s => `
                <div class="flex items-center justify-between p-3 border-b border-gray-100">
                  <div><div class="font-medium">${s.name || '—'}</div><div class="text-sm text-gray-500">${s.email || '—'} • Roll: ${s.rollNumber || '—'} • ${s.department || '—'}</div></div>
                  <div class="text-sm text-gray-400">${formatDate(s.createdAt)}</div>
                </div>
              `).join('');
                }
            } catch (err) {
                console.error(err);
                document.getElementById('studentListAdmin').innerHTML =
                    `<div class="text-center py-8 text-red-500">Error loading students: ${err.message}</div>`;
            }
        }

        // ─── Admin Reports ───
        async function renderAdminReports(container) {
            container.innerHTML = `
            <div class="mb-6"><h1 class="text-2xl font-bold text-gray-900">Reports & Analytics</h1><p class="text-gray-500">System-wide reports and analytics.</p></div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div class="glass-card rounded-2xl p-6"><h3 class="font-semibold text-gray-800 mb-3"><i class="fas fa-file-alt"></i> Document Categories</h3><div id="reportCategories"><div class="text-center py-4 text-gray-400 text-sm">Loading...</div></div></div>
              <div class="glass-card rounded-2xl p-6"><h3 class="font-semibold text-gray-800 mb-3"><i class="fas fa-users"></i> User Activity</h3><div id="reportActivity"><div class="text-center py-4 text-gray-400 text-sm">Loading...</div></div></div>
            </div>
          `;
            try {
                const docsSnap = await db.collection('documents').get();
                const catMap = {};
                docsSnap.forEach(d => { const cat = d.data().category || 'Other';
                    catMap[cat] = (catMap[cat] || 0) + 1; });
                const catContainer = document.getElementById('reportCategories');
                if (Object.keys(catMap).length === 0) {
                    catContainer.innerHTML =
                        `<div class="text-center py-4 text-gray-400 text-sm">No documents uploaded yet.</div>`;
                } else {
                    catContainer.innerHTML = Object.entries(catMap)
                        .sort((a, b) => b[1] - a[1])
                        .map(([cat, count]) =>
                            `<div class="flex justify-between py-1 border-b border-gray-100 text-sm"><span>${cat}</span><span class="font-medium">${count}</span></div>`
                        ).join('');
                }
                const activities = await db.collection('activities').orderBy('timestamp', 'desc').limit(50).get();
                const actContainer = document.getElementById('reportActivity');
                if (activities.empty) {
                    actContainer.innerHTML =
                        `<div class="text-center py-4 text-gray-400 text-sm">No activity recorded.</div>`;
                } else {
                    const roles = {};
                    activities.forEach(d => { const r = d.data().userRole || 'unknown';
                        roles[r] = (roles[r] || 0) + 1; });
                    actContainer.innerHTML = `
                <div class="space-y-2 text-sm">
                  ${Object.entries(roles).map(([role, count]) =>
                    `<div class="flex justify-between"><span class="capitalize">${role}</span><span class="font-medium">${count} actions</span></div>`
                  ).join('')}
                  <div class="text-xs text-gray-400 mt-2">Last 50 activities shown</div>
                </div>
              `;
                }
            } catch (err) {
                console.error(err);
                showToast('Error loading reports: ' + err.message, 'error');
            }
        }

        // ─── Hash change ───
        window.addEventListener('hashchange', renderApp);

        // ─── Init ───
        if (!window.location.hash) window.location.hash = 'dashboard';
        window.addEventListener('resize', () => {
            if (window.innerWidth > 768) document.getElementById('sidebar').classList.remove('open');
        });

        console.log('🚀 EduLocker initialized.');
        console.log('📚 For demo: student@demo.com / password123');
    </script>

</body>
</html>
